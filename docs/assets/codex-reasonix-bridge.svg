<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="800"
  viewBox="0 0 1600 800"
  fill="none"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Codex supervises Reasonix through a security-first MCP bridge</title>
  <desc id="description">
    Codex owns the task contract, review, and commit decision. The MCP bridge
    validates and bounds the work. Reasonix implements inside an isolated Git
    worktree and sandbox.
  </desc>

  <defs>
    <linearGradient id="background" x1="90" y1="40" x2="1510" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081426" />
      <stop offset="0.52" stop-color="#111A31" />
      <stop offset="1" stop-color="#071D26" />
    </linearGradient>
    <linearGradient id="headline" x1="94" y1="121" x2="846" y2="177" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC" />
      <stop offset="0.5" stop-color="#DCE7FF" />
      <stop offset="1" stop-color="#A7F3D0" />
    </linearGradient>
    <linearGradient id="bridge" x1="490" y1="385" x2="1035" y2="385" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" />
      <stop offset="0.5" stop-color="#38BDF8" />
      <stop offset="1" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="shield" x1="716" y1="278" x2="829" y2="423" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC" />
      <stop offset="1" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="worker-panel" x1="1062" y1="260" x2="1454" y2="575" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C2431" />
      <stop offset="1" stop-color="#0B1828" />
    </linearGradient>
    <radialGradient id="violet-glow" cx="0" cy="0" r="1" gradientTransform="translate(309 389) rotate(90) scale(270)">
      <stop stop-color="#8B5CF6" stop-opacity="0.24" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="green-glow" cx="0" cy="0" r="1" gradientTransform="translate(1320 415) rotate(90) scale(300)">
      <stop stop-color="#34D399" stop-opacity="0.2" />
      <stop offset="1" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#A5B4FC" stroke-opacity="0.055" />
    </pattern>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.35" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L9 5L1 9" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <rect width="1600" height="800" rx="40" fill="url(#background)" />
  <rect width="1600" height="800" rx="40" fill="url(#grid)" />
  <ellipse cx="309" cy="389" rx="320" ry="300" fill="url(#violet-glow)" />
  <ellipse cx="1320" cy="415" rx="340" ry="330" fill="url(#green-glow)" />

  <g opacity="0.7">
    <circle cx="1450" cy="107" r="3" fill="#7DD3FC" />
    <circle cx="1490" cy="148" r="2" fill="#A7F3D0" />
    <circle cx="1387" cy="77" r="2" fill="#C4B5FD" />
    <path d="M135 684H1465" stroke="#E2E8F0" stroke-opacity="0.08" />
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="92" y="72" width="330" height="38" rx="19" fill="#111D37" stroke="#818CF8" stroke-opacity="0.42" />
    <circle cx="115" cy="91" r="5" fill="#34D399" filter="url(#soft-glow)" />
    <text x="133" y="97" fill="#C7D2FE" font-size="15" font-weight="700" letter-spacing="2.2">SECURITY-FIRST MCP BRIDGE</text>

    <text x="92" y="174" fill="url(#headline)" font-size="58" font-weight="760" letter-spacing="-2.2">
      Supervise the work. Keep the decision.
    </text>
    <text x="95" y="212" fill="#94A3B8" font-size="20" font-weight="450">
      Codex defines and reviews. Reasonix implements inside a bounded workspace.
    </text>

    <!-- Codex supervisor card -->
    <g filter="url(#shadow)">
      <rect x="90" y="268" width="390" height="334" rx="28" fill="#10182D" stroke="#8B5CF6" stroke-opacity="0.38" />
      <rect x="91" y="269" width="388" height="332" rx="27" stroke="#FFFFFF" stroke-opacity="0.035" />
    </g>
    <g transform="translate(122 302)">
      <rect width="72" height="72" rx="22" fill="#1E1B4B" stroke="#A78BFA" stroke-opacity="0.65" />
      <circle cx="36" cy="36" r="20" stroke="#C4B5FD" stroke-width="3" />
      <path d="M28 36H44M36 28V44" stroke="#F5F3FF" stroke-width="3" stroke-linecap="round" />
      <circle cx="36" cy="36" r="5" fill="#8B5CF6" />
    </g>
    <text x="218" y="328" fill="#F8FAFC" font-size="25" font-weight="750" letter-spacing="0.5">CODEX</text>
    <text x="218" y="354" fill="#A78BFA" font-size="14" font-weight="700" letter-spacing="2">SUPERVISOR</text>

    <g transform="translate(122 405)">
      <circle cx="12" cy="12" r="12" fill="#312E81" />
      <path d="M7.5 12L10.5 15L17 8.5" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="38" y="18" fill="#E2E8F0" font-size="18" font-weight="600">Owns the task contract</text>

      <circle cx="12" cy="67" r="12" fill="#312E81" />
      <path d="M6 67H18M12 61V73" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="73" fill="#E2E8F0" font-size="18" font-weight="600">Reviews bounded evidence</text>

      <circle cx="12" cy="122" r="12" fill="#312E81" />
      <path d="M7.5 122L10.5 125L17 118.5" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="38" y="128" fill="#E2E8F0" font-size="18" font-weight="600">Keeps the commit decision</text>
    </g>

    <!-- Bridge lanes -->
    <g>
      <path d="M498 351H1050" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="52" stroke-linecap="round" />
      <path d="M498 351H1040" stroke="url(#bridge)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
      <path d="M1040 415H510" stroke="#64748B" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="7 10" marker-end="url(#arrow)" />
      <path d="M498 479H1040" stroke="#34D399" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="7 10" marker-end="url(#arrow)" />

      <rect x="538" y="330" width="112" height="42" rx="21" fill="#172554" stroke="#818CF8" stroke-opacity="0.6" />
      <text x="594" y="357" text-anchor="middle" fill="#E0E7FF" font-size="15" font-weight="700">delegate</text>

      <rect x="884" y="394" width="112" height="42" rx="21" fill="#10263A" stroke="#38BDF8" stroke-opacity="0.55" />
      <text x="940" y="421" text-anchor="middle" fill="#BAE6FD" font-size="15" font-weight="700">inspect</text>

      <rect x="538" y="458" width="112" height="42" rx="21" fill="#102A2B" stroke="#34D399" stroke-opacity="0.55" />
      <text x="594" y="485" text-anchor="middle" fill="#A7F3D0" font-size="15" font-weight="700">control</text>
    </g>

    <!-- Security shield at the bridge center -->
    <g filter="url(#shadow)">
      <circle cx="772" cy="415" r="92" fill="#0C172A" stroke="#38BDF8" stroke-opacity="0.2" />
      <circle cx="772" cy="415" r="75" fill="#0D2030" stroke="#A7F3D0" stroke-opacity="0.18" />
      <path
        d="M772 355L818 373V408C818 443 798 468 772 480C746 468 726 443 726 408V373L772 355Z"
        fill="url(#shield)"
        fill-opacity="0.14"
        stroke="url(#shield)"
        stroke-width="3"
      />
      <path d="M751 416L766 431L796 398" stroke="#D1FAE5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="716" y="505" width="112" height="32" rx="16" fill="#0F2B31" stroke="#34D399" stroke-opacity="0.42" />
      <text x="772" y="526" text-anchor="middle" fill="#6EE7B7" font-size="12" font-weight="750" letter-spacing="1.6">VALIDATE + BOUND</text>
    </g>

    <!-- Reasonix worker card -->
    <g filter="url(#shadow)">
      <rect x="1050" y="268" width="460" height="334" rx="28" fill="url(#worker-panel)" stroke="#34D399" stroke-opacity="0.38" />
      <rect x="1065" y="283" width="430" height="304" rx="20" stroke="#6EE7B7" stroke-opacity="0.2" stroke-dasharray="7 8" />
    </g>
    <text x="1088" y="320" fill="#F8FAFC" font-size="25" font-weight="750" letter-spacing="0.5">REASONIX</text>
    <text x="1088" y="346" fill="#34D399" font-size="14" font-weight="700" letter-spacing="2">ISOLATED WORKER</text>
    <rect x="1364" y="301" width="102" height="30" rx="15" fill="#0C302B" stroke="#34D399" stroke-opacity="0.45" />
    <circle cx="1383" cy="316" r="4" fill="#34D399" />
    <text x="1396" y="321" fill="#A7F3D0" font-size="12" font-weight="700">SANDBOX</text>

    <g transform="translate(1088 375)">
      <rect width="338" height="156" rx="16" fill="#07111F" stroke="#334155" />
      <rect width="338" height="36" rx="16" fill="#111D2E" />
      <path d="M0 36H338" stroke="#334155" />
      <circle cx="20" cy="18" r="4.5" fill="#FB7185" />
      <circle cx="36" cy="18" r="4.5" fill="#FBBF24" />
      <circle cx="52" cy="18" r="4.5" fill="#34D399" />
      <text x="78" y="23" fill="#64748B" font-size="12" font-weight="600">reasonix/task-worktree</text>
      <text x="22" y="69" fill="#6EE7B7" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$ implement --scope bounded</text>
      <rect x="22" y="87" width="218" height="7" rx="3.5" fill="#1E3A4B" />
      <rect x="22" y="106" width="282" height="7" rx="3.5" fill="#1E293B" />
      <rect x="22" y="125" width="174" height="7" rx="3.5" fill="#1E293B" />
    </g>

    <g transform="translate(1088 551)">
      <rect width="116" height="30" rx="15" fill="#132337" />
      <path d="M15 15H25M20 10V20" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round" />
      <text x="34" y="20" fill="#BAE6FD" font-size="12" font-weight="650">Git worktree</text>
      <rect x="126" width="117" height="30" rx="15" fill="#132337" />
      <path d="M142 11V19M138 15H146" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round" />
      <text x="154" y="20" fill="#A7F3D0" font-size="12" font-weight="650">Network off</text>
    </g>

    <!-- Footer assurance -->
    <g transform="translate(90 704)">
      <rect width="1420" height="52" rx="18" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08" />
      <circle cx="28" cy="26" r="8" fill="#34D399" fill-opacity="0.16" stroke="#34D399" />
      <path d="M24 26L27 29L32 23" stroke="#A7F3D0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
      <text x="51" y="32" fill="#CBD5E1" font-size="17" font-weight="550">
        No automatic push, merge, cherry-pick, or mutation of the caller's main worktree.
      </text>
      <text x="1384" y="32" text-anchor="end" fill="#64748B" font-size="14" font-weight="650">MCP + ACP</text>
    </g>
  </g>
</svg>
