name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22
          - os: ubuntu-24.04
            node: 24
          - os: macos-15
            node: 22
    steps:
      - uses: actions/checkout@v7
      - name: Install bubblewrap (command sandbox)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow bwrap user namespaces (Ubuntu 24.04 AppArmor)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Diagnostic — seatbelt profile probes (temporary)
        if: runner.os == 'macOS'
        run: |
          set +e
          PROF='(version 1)(allow default)(deny network*)(deny file-write* (subpath "/"))(deny file-link)'
          for probe in "/usr/bin/test -f /etc/hosts" "/bin/cat /etc/hosts" "/bin/sleep 0" "$(command -v git) --version" "/bin/sh -c 'echo hi'" "echo builtin-ok"; do
            echo "=== sandbox-exec -- $probe ==="
            sandbox-exec -p "$PROF" -- $probe 2>&1
            echo "exit=$?"
          done
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
